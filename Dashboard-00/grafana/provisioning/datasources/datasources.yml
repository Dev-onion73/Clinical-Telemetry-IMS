apiVersion: 1

datasources:

  - name: Clinical PostgreSQL
    type: postgres
    access: proxy
    url: clinical-postgres:5432
    user: clinical
    secureJsonData:
      password: clinical123
    jsonData:
      database: clinical
      sslmode: disable
      postgresVersion: 1700

  - name: Clinical InfluxDB
    type: influxdb
    access: proxy
    url: http://clinical-influxdb:8086
    jsonData:
      version: Flux
      organization: clinical
      defaultBucket: vitals
    secureJsonData:
      token: clinical-token

  - name: Clinical Tempo
    type: tempo
    access: proxy
    url: http://clinical-tempo:3200