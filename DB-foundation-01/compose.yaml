services:

  postgres:
    image: postgres:17
    container_name: clinical-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: clinical
      POSTGRES_PASSWORD: clinical123
      POSTGRES_DB: clinical

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinical -d clinical"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - clinical-net


  influxdb:
    image: influxdb:2.7
    container_name: clinical-influxdb
    restart: unless-stopped

    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin123
      DOCKER_INFLUXDB_INIT_ORG: clinical
      DOCKER_INFLUXDB_INIT_BUCKET: vitals
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: clinical-token

    ports:
      - "8086:8086"

    volumes:
      - influx-data:/var/lib/influxdb2

    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      - clinical-net


networks:
  clinical-net:
    external: true


volumes:
  postgres-data:
  influx-data: